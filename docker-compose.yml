services:
  db:
    image: postgres:15
    container_name: lassitown_db
    environment:
      POSTGRES_USER: lassi_user
      POSTGRES_PASSWORD: lassi_password
      POSTGRES_DB: lassitown
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: lassitown_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg2://lassi_user:lassi_password@db:5432/lassitown
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: lassitown_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
